<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Test</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  </head>
<body class="bg-gray-100 p-6">

  <div class="flex flex-col items-center justify-center space-y-6 mt-2">
    <div class="h-16 w-16 rounded-full bg-blue-500"></div>
    <div class="h-16 w-16 rounded-full bg-orange-500"></div>
    <div class="h-16 w-16 rounded-full bg-green-500"></div>
  </div>

  <!-- grid -->
   <div class="grid grid-cols-5 gap-2 mt-2 mx-2 grid-rows-1">
    <div class="h-16 rounded-full bg-blue-500"></div>
    <div class="h-16 rounded-full bg-orange-500"></div>
    <div class="h-16 rounded-full bg-green-500"></div>

   </div>

   <!-- dark mode -->
    <div class="bg-white dark:bg-gray-800 rounded-lg px-6 py-8 ring shadow-xl ring-gray-900/5 mt-5">
  <div>
    <span class="inline-flex items-center justify-center rounded-md bg-indigo-500 p-2 shadow-lg">
      <svg class="h-6 w-6 stroke-white" ...>
        <!-- ... -->
      </svg>
    </span>
  </div>
  <h3 class="text-gray-900 dark:text-white mt-5 text-base font-medium tracking-tight ">Writes upside-down</h3>
  <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm ">
    The Zero Gravity Pen can be used to write in any orientation, including upside-down. It even works in outer space.
  </p>
  <button
  id="toggleDark"
  class="px-4 py-2 text-sm font-medium mt-8 text-blue-900 bg-blue-100 rounded-md"
  onclick="document.body.classList.toggle('dark')">Toggle Dark Mode</button>
</div>
</body>
</html>
