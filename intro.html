<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Mode Example</title>

  <script>
    tailwind.config = {
      darkMode: "class"
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white-100 dark:bg-black p-6">

  <div class="flex flex-col items-center justify-center space-y-6">
    <div class="h-16 w-16 rounded-full bg-blue-500"></div>
    <div class="h-16 w-16 rounded-full bg-orange-500"></div>
    <div class="h-16 w-16 rounded-full bg-green-500"></div>
  </div>

  <div class="bg-white dark:bg-white-800 rounded-lg px-6 py-8 shadow-xl mt-5">
    
    <h3 class="text-gray-900 dark:text-white text-lg font-bold">
      Dark Mode Demo
    </h3>

    <p class="text-gray-500 dark:text-gray-300 mt-2">
      Click the button below to switch between light and dark mode.
    </p>

  <button
  class="px-4 py-2 bg-blue-500 text-white rounded"
  id="toggleDark">
  Toggle Dark Mode
</button>

<script>
const btn = document.getElementById("toggleDark");

btn.onclick = function () {
    alert("clicked");
    document.body.style.backgroundColor = "black";
};
</script>

</body>
</html>
